name: .NET CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SampleApi.slnx

      - name: Build
        run: dotnet build SampleApi.slnx --no-restore --configuration Release
        
      - name: Run tests
        run: dotnet test SampleApi.slnx --no-build --configuration Release

      - name: Run tests
        run: dotnet test SampleApi.sln --no-build --configuration Release
