name: CI - Build Test Quality

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  build-test-quality:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SimpleApi.sln

      - name: Check code formatting
        run: dotnet format SimpleApi.sln --verify-no-changes

      - name: Build solution
        run: dotnet build SimpleApi.sln --no-restore --configuration Release

      - name: Run tests with code coverage
        run: dotnet test SimpleApi.sln --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload code coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'